name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node 22 / npm 10.9.8
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/codelink
    env:
      npm_config_registry: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: plugins/codelink/package-lock.json
      - run: npm install --global npm@10.9.8
      - run: npm ci --no-audit --no-fund
      - name: Check installer ESM syntax on Windows
        if: runner.os == 'Windows'
        run: |
          node --check test/setup-platform.test.mjs
          node --check scripts/setup-lib.mjs
          node --check scripts/render-launch-agent.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify committed runtime is current
        run: git diff --exit-code -- dist/cli.cjs dist/mcp.js dist/runtime-manifest.json

  lockfile-compatibility:
    name: Lockfile / Node ${{ matrix.node }} / npm ${{ matrix.npm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.14.0
            npm: 10.9.8
          - node: 24.14.0
            npm: 11.18.0
    defaults:
      run:
        working-directory: plugins/codelink
    env:
      npm_config_registry: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global npm@${{ matrix.npm }}
      - run: npm ci --dry-run --ignore-scripts --no-audit --no-fund

  dependency-resolution:
    name: Dependencies / ${{ matrix.target_os }} / ${{ matrix.target_cpu }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_os: [darwin, linux]
        target_cpu: [x64, arm64]
    defaults:
      run:
        working-directory: plugins/codelink
    env:
      npm_config_registry: https://registry.npmjs.org
      npm_config_os: ${{ matrix.target_os }}
      npm_config_cpu: ${{ matrix.target_cpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install --global npm@10.9.8
      - run: npm ci --dry-run --ignore-scripts --no-audit --no-fund
